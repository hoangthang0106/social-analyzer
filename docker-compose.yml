# Reduced Web UI deployment: no public Selenium Grid/VNC ports; advanced webdriver workflows need separate config.
# IT-MANAGER: Default Docker Compose for mobile Portainer. Port bindings follow the 1889x sequence.
# Use LAN_IP, OSINT_AUTH_USER, OSINT_AUTH_PASSWORD entered in Portainer; verify port before deployment.
# Social Analyzer; Portainer LAN Stack; fork: https://github.com/hoangthang0106/social-analyzer
# Sequential 1889x OSINT LAN ports; availability is not verified until checked on Docker VM/LXC.
services:
  social-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.portainer
    image: local/osint-social-analyzer:portainer
    restart: unless-stopped
    environment:
      PORT: "18898"
    security_opt:
      - no-new-privileges:true
    volumes:
      - analyzer_logs:/usr/src/app/logs
  gateway:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - social-analyzer
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LAN_IP:?ENTER_LAN_IP}:${SOCIAL_ANALYZER_HOST_PORT:-18898}:18898/tcp"
    environment:
      AUTH_USER: "${OSINT_AUTH_USER:?ENTER_USERNAME}"
      AUTH_PASSWORD: "${OSINT_AUTH_PASSWORD:?ENTER_PASSWORD_IN_PORTAINER}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        HASH=$$(caddy hash-password --algorithm bcrypt --plaintext "$$AUTH_PASSWORD")
        printf '%s\n' ':18898 {' '  basic_auth {' "    $$AUTH_USER $$HASH" '  }' '  reverse_proxy social-analyzer:18898' '}' > /etc/caddy/Caddyfile
        caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
volumes:
  analyzer_logs:
